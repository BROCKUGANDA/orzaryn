[workspace]
# The package sits at the workspace root itself (single-program layout);
# anchor build only builds programs listed here (get_rust_program_list).
members = ["."]

[features]
seeds = false
skip-lint = false

[programs.localnet]
# This ID is the pubkey of the program keypair at target/deploy/ (vanity-ground,
# 'orz' prefix). smoke.sh asserts the two agree before testing.
orzaryn_escrow = "orZk41HX7uemYZK66UZU6xJeMbeiWdo9Cmb7C8x7kNu"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "bash tests/smoke.sh"
