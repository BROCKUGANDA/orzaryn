[package]
name = "orzaryn-escrow"
version = "0.1.0"
description = "ORZARYN escrow program — mandate-bounded work-order settlement (STAGING SOURCE, UNCOMPILED — see README)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "orzaryn_escrow"

[features]
no-entrypoint = []
no-idl = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
default = []

[dependencies]
# init-if-needed is used ONLY for the escrow token account, whose address is
# pinned by a seeds constraint ([b"escrow", work_order]) and whose authority is
# the work-order PDA — re-initialization attacks are excluded by construction.
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"
spl-token = { version = ">=4", features = ["no-entrypoint"] }

[profile.release]
overflow-checks = true

[workspace]
# single-program Anchor workspace (anchor build runs cargo-build-sbf here)
